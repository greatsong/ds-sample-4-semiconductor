<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>센서로 불량 웨이퍼 가려내기</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔬</text></svg>" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/browser@1.4.0/build/stlite.css" />
  <style>
    #loading { font-family: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; padding: 56px 24px; text-align: center; color: #1c2a3a; }
    #loading h2 { margin: 0 0 10px; font-size: 22px; }
    #loading p { margin: 4px 0; color: #56657a; font-size: 15px; }
  </style>
</head>
<body>
  <div id="root">
    <div id="loading">
      <h2>🔬 센서로 불량 웨이퍼 가려내기</h2>
      <p>브라우저 안에서 파이썬을 준비하고 있습니다.</p>
      <p>처음 열 때 1분쯤 걸립니다(데이터 5.7MB를 함께 불러옵니다).</p>
    </div>
  </div>
  <script type="module">
    import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/browser@1.4.0/build/stlite.js";
    mount(
      {
        requirements: ["pandas", "numpy", "plotly", "scikit-learn"],
        entrypoint: "code/main.py",
        streamlitConfig: { "theme.base": "light" },
        files: {
          "code/main.py": { url: "./code/main.py" },
          "data/secom.csv": { url: "./data/secom.csv" },
        },
      },
      document.getElementById("root")
    );
  </script>
</body>
</html>
